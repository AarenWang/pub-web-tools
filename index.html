<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="探索 RGB 和 CMYK 色彩的交互式网页工具。">
  <title>网页工具库 · 色彩实验室</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #090d16; color: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 80% 0%, #1c2842 0, transparent 45%), #090d16; }
    main { max-width: 1020px; margin: 0 auto; padding: 88px 24px 72px; }
    .eyebrow { color: #86aafc; font-size: 13px; font-weight: 700; letter-spacing: .15em; }
    h1 { margin: 18px 0 12px; font-size: clamp(36px, 7vw, 58px); letter-spacing: -.04em; }
    .intro { color: #a6b2c6; font-size: 17px; line-height: 1.8; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 48px; }
    .card { display: flex; flex-direction: column; min-height: 260px; padding: 28px; border: 1px solid #29344a; border-radius: 20px; background: #111827; color: inherit; text-decoration: none; transition: transform .2s, border-color .2s; }
    .card:hover { transform: translateY(-4px); border-color: #7896d8; }
    .card:focus-visible { outline: 3px solid #a8c3ff; outline-offset: 4px; }
    .swatches { display: flex; gap: 7px; margin-bottom: 28px; }
    .swatches span { width: 22px; height: 22px; border-radius: 50%; }
    h2 { margin: 0 0 10px; font-size: 24px; }
    .card p { margin: 0; color: #a6b2c6; line-height: 1.7; }
    .link { margin-top: auto; padding-top: 24px; color: #a8c3ff; font-weight: 600; }
    footer { margin-top: 52px; color: #7e8ca3; font-size: 13px; }
    @media (max-width: 620px) { main { padding-top: 56px; } .grid { grid-template-columns: 1fr; margin-top: 32px; } .card { min-height: 225px; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PUB WEB TOOLS</div>
    <h1>色彩实验室</h1>
    <p class="intro">通过交互式工具，探索屏幕与印刷中的色彩。</p>
    <div class="grid">
      <a class="card" href="rgb.html">
        <div class="swatches" aria-hidden="true"><span style="background:#f87171"></span><span style="background:#4ade80"></span><span style="background:#60a5fa"></span></div>
        <h2>RGB 色彩实验室</h2>
        <p>探索红、绿、蓝光的混合与屏幕色彩。</p>
        <span class="link">打开 RGB 工具 →</span>
      </a>
      <a class="card" href="cmyk.html">
        <div class="swatches" aria-hidden="true"><span style="background:#22d3ee"></span><span style="background:#e879f9"></span><span style="background:#facc15"></span><span style="background:#64748b"></span></div>
        <h2>CMYK 印刷色彩实验室</h2>
        <p>探索青、品红、黄、黑在印刷中的色彩表现。</p>
        <span class="link">打开 CMYK 工具 →</span>
      </a>
    </div>
    <footer>网页工具库 · 色彩实验室</footer>
  </main>
</body>
</html>
